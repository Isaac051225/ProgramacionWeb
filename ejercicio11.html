<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de distancia</title>
    <link rel="stylesheet" href="css/ejercicio11.css">
</head>
<body>

    <div class="calculadora">
        <h1>Conversor</h1>
        <p class="subtitulo">Kilometros a Millas</p>

        <form id="form-conversor" onsubmit="return false;">
            <!-- Campo de entrada kilometros -->
            <div class="grupo-formulario">
                <label for="kilometros">Kilometros (Km):</label>
                <input type="text" id="kilometros" placeholder="Ej: 10">
                <div id="error-msg" class="mensaje-error">Por favor, ingresa un valor numérico válido.</div>
            </div>

            <!-- Botón de conversión -->
            <div class="grupo-formulario">
                <button type="button" id="btn-convertir" class="boton-convertir">Convertir</button>
            </div>

            <!-- Caja de resultado Readonly -->
            <div class="grupo-formulario">
                <label for="millas">Millas (mi):</label>
                <input type="text" id="millas" readonly placeholder="Resultado...">
            </div>
        </form>
    </div>

    <!-- Archivo de JavaScript -->
    <script src="js/ejercicio11.js"></script>
</body>
</html>
