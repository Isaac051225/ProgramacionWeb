<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Temperatura</title>
    <link rel="stylesheet" href="css/ejercicio10.css">
</head>
<body>

    <div class="calculadora">
        <h1>Conversor</h1>
        <p class="subtitulo">Celsius a Fahrenheit</p>

        <form id="form-conversor" onsubmit="return false;">
            <!-- Campo de entrada Celsius -->
            <div class="grupo-formulario">
                <label for="celsius">Grados Celsius (°C):</label>
                <input type="text" id="celsius" placeholder="Ej: 25">
                <div id="error-msg" class="mensaje-error">Por favor, ingresa un valor numérico válido.</div>
            </div>

            <!-- Botón de conversión -->
            <div class="grupo-formulario">
                <button type="button" id="btn-convertir" class="boton-convertir">Convertir</button>
            </div>

            <!-- Caja de resultado Readonly -->
            <div class="grupo-formulario">
                <label for="fahrenheit">Grados Fahrenheit (°F):</label>
                <input type="text" id="fahrenheit" readonly placeholder="Resultado...">
            </div>
        </form>
    </div>

    <!-- Archivo de JavaScript -->
    <script src="js/ejercicio10.js"></script>
</body>
</html>
