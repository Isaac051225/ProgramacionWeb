<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="css/ejercicio16.css">
</head>

<body>

    <div class="calculadora">

        <h1>Calculadora</h1>

        <div class="grupo-formulario">
            <label for="numero1">Número 1:</label>
            <input type="text" id="numero1" placeholder="Ingresa un número">
        </div>

        <div class="grupo-formulario">
            <label for="numero2">Número 2:</label>
            <input type="text" id="numero2" placeholder="Ingresa un número">
        </div>

        <div class="grupo-formulario">
            <button type="button" id="btn-sumar">Sumar</button>
            <button type="button" id="btn-restar">Restar</button>
            <button type="button" id="btn-multiplicar">Multiplicar</button>
            <button type="button" id="btn-dividir">Dividir</button>
        </div>

        <div class="grupo-formulario">
            <label for="resultado">Resultado:</label>
            <input type="text" id="resultado" readonly>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/ejercicio16.js"></script>

</body>
</html>
